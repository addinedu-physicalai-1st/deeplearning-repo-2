[project]
name = "monitor-shared"
version = "0.1.0"
description = "Shared schemas and utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
