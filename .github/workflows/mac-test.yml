              sleep 2
            fi
          done
          
          echo "❌ $name health check failed after $max_attempts attempts: HTTP $http_code"
          echo "Response: $body"
          echo "Log:"
          cat "/tmp/${name}.log" || true
          return 1
        }
        
        test_health "http://localhost:8002/health" "ai_emotion"
        
