              return 0
            fi
            
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "⚠️  $name health check attempt $attempt failed (HTTP $http_code), retrying..."
              sleep 2
            fi
          done
          
          echo "❌ $name health check failed after $max_attempts attempts: HTTP $http_code"
          echo "Response: $body"
          echo "Log:"
          cat "/tmp/${name}.log" || true
          return 1
        }
        
        test_health "http://localhost:8004/health" "llm_server"
        
    - name: Verify all servers are running
      run: |
        servers=("ai_head:8001" "ai_emotion:8002" "ai_body:8003" "ai_interface:8010" "llm_server:8004")
        all_running=true
        
        for server_info in "${servers[@]}"; do
          IFS=':' read -r name port <<< "$server_info"
          pid_file="/tmp/${name}.pid"
          
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            if ps -p "$pid" > /dev/null 2>&1; then
              echo "✅ $name (Port $port) is running (PID: $pid)"
            else
              echo "❌ $name (Port $port) is not running"
              echo "Log:"
              cat "/tmp/${name}.log" || true
              all_running=false
            fi
          else
            echo "❌ $name PID file not found"
            all_running=false
          fi
        done
        
        if [ "$all_running" = false ]; then
          exit 1
        fi
        
    - name: Stop all servers
      if: always()
      run: |
        for pid_file in /tmp/ai_head.pid /tmp/ai_emotion.pid /tmp/ai_body.pid /tmp/ai_interface.pid /tmp/llm_server.pid; do
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            kill "$pid" 2>/dev/null || true
            rm "$pid_file" || true
          fi
        done
