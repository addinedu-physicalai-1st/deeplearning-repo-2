name: MacOS x86 Test - AI Servers

on: [push]

jobs:
  test-ai-servers:
    runs-on: macos-15-intel  # macOS Intel (x86_64) 기반
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Remove jax/jaxlib from uv.lock (macOS x86_64)
      if: runner.os == 'macOS'
      run: |
        # macOS x86_64에서 uv.lock에서 jax/jaxlib 제거
        if [[ "$(uname -m)" == "x86_64" ]] && [ -f "uv.lock" ]; then
          echo "Removing jax/jaxlib from uv.lock..."
          cat > /tmp/remove_jaxlib.py <<'PYEOF'
import re
from pathlib import Path

lock_path = Path("uv.lock")
if not lock_path.exists():
    exit(0)

content = lock_path.read_text(encoding='utf-8')
original_content = content

# jax와 jaxlib 패키지 섹션 제거
for package_name in ["jax", "jaxlib"]:
    while True:
        pattern = rf'\[\[package\]\]\nname = "{package_name}".*?(?=\n\[\[package\]\]|\Z)'
        new_content = re.sub(pattern, '', content, flags=re.DOTALL, count=1)
        if new_content == content:
            break
        content = new_content

# dependencies 배열에서 jax와 jaxlib 항목 제거
for package_name in ["jax", "jaxlib"]:
    for _ in range(20):
        pattern = rf'\s*{{\s*name\s*=\s*"{package_name}".*?}},?\s*\n'
        new_content = re.sub(pattern, '', content, flags=re.DOTALL, count=1)
        if new_content == content:
            break
        content = new_content

# 잘못된 구문 정리
content = re.sub(r'dependencies = \[\s*marker\s*=\s*"[^"]*"\s*\},\s*\n', 'dependencies = [\n', content)
content = re.sub(r'dependencies = \[\s*\},\s*\n', 'dependencies = [\n', content)
content = re.sub(r'dependencies = \[\s*\]', 'dependencies = []', content)
content = re.sub(r'\n\n\n+', '\n\n', content)

if content != original_content:
    lock_path.write_text(content, encoding='utf-8')
    print("✅ Removed jax/jaxlib from uv.lock")
else:
    print("ℹ️  No jax/jaxlib found in uv.lock")
PYEOF
          python3 /tmp/remove_jaxlib.py
          rm /tmp/remove_jaxlib.py
        fi
        
    - name: Install dependencies
      run: |
        uv sync --no-dev
        
    - name: Remove jax/jaxlib packages (macOS x86_64)
      if: runner.os == 'macOS'
      run: |
        # macOS x86_64에서 설치된 jax/jaxlib 제거
        if [[ "$(uname -m)" == "x86_64" ]]; then
          echo "Removing jax/jaxlib packages..."
          uv pip uninstall -y jax jaxlib 2>/dev/null || true
          echo "✅ jax/jaxlib removed"
        fi
        
    - name: Create .env files for all servers
      run: |
        # 공통 API_KEY 설정
        TEST_API_KEY="test-api-key-for-ci"
        
        # ai_head (Port 8001)
        cd apps/ai_head
        cp .env.example .env
        if [[ "$OSTYPE" == "darwin"* ]]; then
          sed -i '' "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        else
          sed -i "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        fi
        cd ../..
        
        # ai_emotion (Port 8002)
        cd apps/ai_emotion
        cp .env.example .env
        if [[ "$OSTYPE" == "darwin"* ]]; then
          sed -i '' "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        else
          sed -i "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        fi
        cd ../..
        
        # ai_body (Port 8003)
        cd apps/ai_body
        cp .env.example .env
        if [[ "$OSTYPE" == "darwin"* ]]; then
          sed -i '' "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        else
          sed -i "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        fi
        cd ../..
        
        # ai_interface (Port 8010)
        cd apps/ai_interface
        cp .env.example .env
        if [[ "$OSTYPE" == "darwin"* ]]; then
          sed -i '' "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        else
          sed -i "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        fi
        cd ../..
        
        # llm_server (Port 8004)
        cd apps/llm_server
        cp .env.example .env
        if [[ "$OSTYPE" == "darwin"* ]]; then
          sed -i '' "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        else
          sed -i "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        fi
        # Ollama 모델은 선택사항이므로 기본값 유지
        cd ../..
        
    - name: Start all AI servers
      run: |
        # ai_head 서버 시작 (Port 8001)
        cd apps/ai_head
        uv run python src/ai_head/main.py > /tmp/ai_head.log 2>&1 &
        echo $! > /tmp/ai_head.pid
        cd ../..
        
        # ai_emotion 서버 시작 (Port 8002)
        cd apps/ai_emotion
        uv run python src/ai_emotion/main.py > /tmp/ai_emotion.log 2>&1 &
        echo $! > /tmp/ai_emotion.pid
        cd ../..
        
        # ai_body 서버 시작 (Port 8003)
        cd apps/ai_body
        uv run python src/ai_body/main.py > /tmp/ai_body.log 2>&1 &
        echo $! > /tmp/ai_body.pid
        cd ../..
        
        # ai_interface 서버 시작 (Port 8010)
        cd apps/ai_interface
        uv run python src/ai_interface/main.py > /tmp/ai_interface.log 2>&1 &
        echo $! > /tmp/ai_interface.pid
        cd ../..
        
        # llm_server 서버 시작 (Port 8004)
        cd apps/llm_server
        uv run python src/llm_server/main.py > /tmp/llm_server.log 2>&1 &
        echo $! > /tmp/llm_server.pid
        cd ../..
        
        echo "Waiting for servers to start..."
        sleep 2  # 초기 시작 대기
        
    - name: Check server processes
      run: |
        # 각 서버 프로세스가 실행 중인지 확인
        check_process() {
          local name=$1
          local pid_file="/tmp/${name}.pid"
          
          if [ ! -f "$pid_file" ]; then
            echo "❌ $name: PID file not found"
            return 1
          fi
          
          local pid=$(cat "$pid_file")
          if ps -p "$pid" > /dev/null 2>&1; then
            echo "✅ $name: Process running (PID: $pid)"
            return 0
          else
            echo "❌ $name: Process not running (PID: $pid)"
            echo "Log:"
            cat "/tmp/${name}.log" || true
            return 1
          fi
        }
        
        all_ok=true
        check_process "ai_head" || all_ok=false
        check_process "ai_emotion" || all_ok=false
        check_process "ai_body" || all_ok=false
        check_process "ai_interface" || all_ok=false
        check_process "llm_server" || all_ok=false
        
        if [ "$all_ok" = false ]; then
          echo "Some servers failed to start. Exiting."
          exit 1
        fi
        
    - name: Wait for servers to be ready
      run: |
        # 각 서버가 포트에서 리스닝할 때까지 대기 (최대 30초)
        wait_for_port() {
          local port=$1
          local name=$2
          local max_attempts=30
          local attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if lsof -i :$port > /dev/null 2>&1; then
              echo "✅ $name is listening on port $port"
              return 0
            fi
            attempt=$((attempt + 1))
            sleep 1
          done
          
          echo "❌ $name failed to start on port $port after ${max_attempts} seconds"
          return 1
        }
        
        wait_for_port 8001 "ai_head" || (cat /tmp/ai_head.log && exit 1)
        wait_for_port 8002 "ai_emotion" || (cat /tmp/ai_emotion.log && exit 1)
        wait_for_port 8003 "ai_body" || (cat /tmp/ai_body.log && exit 1)
        wait_for_port 8004 "llm_server" || (cat /tmp/llm_server.log && exit 1)
        wait_for_port 8010 "ai_interface" || (cat /tmp/ai_interface.log && exit 1)
        
        echo "All servers are ready!"
        sleep 2  # 추가 안정화 시간
        
    - name: Test ai_head health endpoint
      run: |
        test_health() {
          local url=$1
          local name=$2
          local max_attempts=5
          local attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -w "\n%{http_code}" -H "X-API-Key: test-api-key-for-ci" "$url" 2>&1)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n-1)
            
            if [ "$http_code" -eq 200 ]; then
              echo "✅ $name health check passed: $body"
              return 0
            fi
            
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "⚠️  $name health check attempt $attempt failed (HTTP $http_code), retrying..."
              sleep 2
            fi
          done
          
          echo "❌ $name health check failed after $max_attempts attempts: HTTP $http_code"
          echo "Response: $body"
          echo "Log:"
          cat "/tmp/${name}.log" || true
          return 1
        }
        
        test_health "http://localhost:8001/health" "ai_head"
        
    - name: Test ai_emotion health endpoint
      run: |
        test_health() {
          local url=$1
          local name=$2
          local max_attempts=5
