name: MacOS x86 Test - AI Body Server

on: [push]

jobs:
  test-ai-body:
    runs-on: macos-15-intel  # macOS Intel (x86_64) 기반
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Install dependencies (macOS x86_64)
      if: runner.os == 'macOS'
      run: |
        # macOS x86_64에서 jaxlib만 제외하고 나머지 의존성 설치
        if [[ "$(uname -m)" == "x86_64" ]]; then
          echo "Installing dependencies (excluding jax/jaxlib on macOS x86_64)..."
          
          # uv sync 실행 (jaxlib 실패해도 계속 진행하도록)
          set +e  # 에러 발생해도 계속 진행
          uv sync --no-dev 2>&1 | tee /tmp/uv_sync.log
          SYNC_EXIT_CODE=${PIPESTATUS[0]}
          set -e  # 다시 에러 시 중단 모드로
          
          # jaxlib 관련 에러만 무시하고 나머지 패키지는 설치되었는지 확인
          if [ $SYNC_EXIT_CODE -ne 0 ]; then
            echo "⚠️  uv sync had errors (likely jaxlib), but continuing..."
            # jaxlib 에러인지 확인
            if grep -q "jaxlib" /tmp/uv_sync.log; then
              echo "✅ jaxlib error detected, removing jax/jaxlib and continuing..."
              uv pip uninstall -y jax jaxlib 2>/dev/null || true
            fi
          fi
          
          # 최종적으로 jax/jaxlib 제거 (혹시 설치되었을 수 있음)
          uv pip uninstall -y jax jaxlib 2>/dev/null || true
          
          # 필수 패키지들이 설치되었는지 확인하고 없으면 설치
          echo "Verifying essential packages..."
          MISSING_PACKAGES=()
          
          if ! uv pip show fastapi >/dev/null 2>&1; then
            MISSING_PACKAGES+=("fastapi")
          fi
          if ! uv pip show uvicorn >/dev/null 2>&1; then
            MISSING_PACKAGES+=("uvicorn")
          fi
          if ! uv pip show opencv-python >/dev/null 2>&1; then
            MISSING_PACKAGES+=("opencv-python")
          fi
          if ! uv pip show mediapipe >/dev/null 2>&1; then
            MISSING_PACKAGES+=("mediapipe")
          fi
          if ! uv pip show numpy >/dev/null 2>&1; then
            MISSING_PACKAGES+=("numpy")
          fi
          
          if [ ${#MISSING_PACKAGES[@]} -gt 0 ]; then
            echo "⚠️  Missing packages detected: ${MISSING_PACKAGES[*]}, installing..."
            uv pip install "${MISSING_PACKAGES[@]}"
          fi
          
          echo "✅ Dependencies installed (jax/jaxlib excluded)"
        else
          uv sync --no-dev
        fi
        
    - name: Install dependencies (non-macOS)
      if: runner.os != 'macOS'
      run: |
        uv sync --no-dev
        
    - name: Create .env file for ai_body
      run: |
        # 공통 API_KEY 설정
        TEST_API_KEY="test-api-key-for-ci"
        
        # ai_body (Port 8003)
        cd apps/ai_body
        cp .env.example .env
        if [[ "$OSTYPE" == "darwin"* ]]; then
          sed -i '' "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        else
          sed -i "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        fi
        cd ../..
        
    - name: Remove jax/jaxlib and prepare environment (macOS x86_64)
      if: runner.os == 'macOS'
      run: |
        # macOS x86_64에서 ai_body 시작 전에 jax/jaxlib 완전히 제거
        if [[ "$(uname -m)" == "x86_64" ]]; then
          echo "Removing jax/jaxlib before starting ai_body..."
          # 루트에서 제거
          uv pip uninstall -y jax jaxlib 2>/dev/null || true
          # ai_body 디렉토리에서도 제거
          cd apps/ai_body
          uv pip uninstall -y jax jaxlib 2>/dev/null || true
          cd ../..
          echo "✅ jax/jaxlib removed"
        fi
        
    - name: Start ai_body server
      run: |
        # ai_body 서버 시작 (Port 8003)
        cd apps/ai_body
        
        # macOS x86_64에서 jaxlib 문제를 완전히 방지
        if [[ "$(uname -m)" == "x86_64" ]] && [[ "$RUNNER_OS" == "macOS" ]]; then
          # jaxlib를 완전히 제거하고 시작
          uv pip uninstall -y jax jaxlib 2>/dev/null || true
          
          # 가상 환경 직접 사용 (uv run의 의존성 재확인 방지)
          cd ../..
          VENV_PATH=".venv"
          if [ -d "$VENV_PATH" ]; then
            # 가상 환경 활성화하고 Python 실행
            source "$VENV_PATH/bin/activate"
            # jaxlib 다시 제거
            pip uninstall -y jax jaxlib 2>/dev/null || true
            # workspace 패키지 설치 (shared 모듈을 위해)
            echo "Installing workspace package (shared)..."
            uv pip install -e packages/shared || pip install -e packages/shared || true
            # 필수 패키지 확인
            python -c "import fastapi, uvicorn, cv2, mediapipe, numpy" 2>/dev/null || {
              echo "⚠️  Some packages missing, installing..."
              pip install fastapi uvicorn opencv-python mediapipe numpy 2>/dev/null || true
            }
            cd apps/ai_body
            python src/ai_body/main.py > /tmp/ai_body.log 2>&1 &
            echo $! > /tmp/ai_body.pid
          else
            # 가상 환경이 없으면 uv run 사용
            cd apps/ai_body
            uv run python src/ai_body/main.py > /tmp/ai_body.log 2>&1 &
            echo $! > /tmp/ai_body.pid
          fi
        else
          uv run python src/ai_body/main.py > /tmp/ai_body.log 2>&1 &
          echo $! > /tmp/ai_body.pid
        fi
        
        cd ../..
        
        echo "Waiting for ai_body server to start..."
        sleep 3  # 서버 시작 대기
        
    - name: Check ai_body process
      run: |
        # ai_body 프로세스가 실행 중인지 확인
        pid_file="/tmp/ai_body.pid"
        
        if [ ! -f "$pid_file" ]; then
          echo "❌ ai_body: PID file not found"
          exit 1
        fi
        
        pid=$(cat "$pid_file")
        if ps -p "$pid" > /dev/null 2>&1; then
          echo "✅ ai_body: Process running (PID: $pid)"
        else
          echo "❌ ai_body: Process not running (PID: $pid)"
          echo "Log:"
          cat "/tmp/ai_body.log" || true
          exit 1
        fi
        
    - name: Wait for ai_body to be ready
      run: |
        # ai_body가 포트에서 리스닝할 때까지 대기 (최대 30초)
        wait_for_port() {
          local port=$1
          local name=$2
          local max_attempts=30
          local attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if lsof -i :$port > /dev/null 2>&1; then
              echo "✅ $name is listening on port $port"
              return 0
            fi
            attempt=$((attempt + 1))
            sleep 1
          done
          
          echo "❌ $name failed to start on port $port after ${max_attempts} seconds"
          return 1
        }
        
        wait_for_port 8003 "ai_body" || (cat /tmp/ai_body.log && exit 1)
        
        echo "ai_body server is ready!"
        sleep 2  # 추가 안정화 시간
        
    - name: Test ai_body health endpoint
      run: |
        test_health() {
          local url=$1
          local name=$2
          local max_attempts=5
          local attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -w "\n%{http_code}" -H "X-API-Key: test-api-key-for-ci" "$url" 2>&1)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n-1)
            
            if [ "$http_code" -eq 200 ]; then
              echo "✅ $name health check passed: $body"
              return 0
            fi
            
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "⚠️  $name health check attempt $attempt failed (HTTP $http_code), retrying..."
              sleep 2
            fi
          done
          
          echo "❌ $name health check failed after $max_attempts attempts: HTTP $http_code"
          echo "Response: $body"
          echo "Log:"
          cat "/tmp/${name}.log" || true
          return 1
        }
        
        test_health "http://localhost:8003/health" "ai_body"
        
    - name: Stop ai_body server
      if: always()
      run: |
        if [ -f "/tmp/ai_body.pid" ]; then
          pid=$(cat "/tmp/ai_body.pid")
          kill "$pid" 2>/dev/null || true
          rm "/tmp/ai_body.pid" || true
        fi
