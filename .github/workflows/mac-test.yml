        test_health "http://localhost:8010/health" "ai_interface"
        
    - name: Test llm_server health endpoint
      run: |
        test_health() {
          local url=$1
          local name=$2
          local max_attempts=5
          local attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -w "\n%{http_code}" -H "X-API-Key: test-api-key-for-ci" "$url" 2>&1)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n-1)
            
            if [ "$http_code" -eq 200 ]; then
