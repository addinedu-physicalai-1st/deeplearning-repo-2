name: MacOS x86 Test - AI Body Server

on: [push]

jobs:
  test-ai-body:
    runs-on: macos-15-intel  # macOS Intel (x86_64) 기반
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        
    - name: Install dependencies (macOS x86_64)
      if: runner.os == 'macOS'
      run: |
        # macOS x86_64에서 jaxlib가 설치 실패해도 계속 진행
        if [[ "$(uname -m)" == "x86_64" ]]; then
          echo "Installing dependencies (jaxlib may fail on macOS x86_64)..."
          uv sync --no-dev || {
            echo "⚠️  uv sync had errors (possibly jaxlib), removing jax/jaxlib and retrying..."
            uv pip uninstall -y jax jaxlib 2>/dev/null || true
            uv sync --no-dev || true
          }
          # 최종적으로 jax/jaxlib 제거
          uv pip uninstall -y jax jaxlib 2>/dev/null || true
          echo "✅ Dependencies installed (jax/jaxlib excluded)"
        else
          uv sync --no-dev
        fi
        
    - name: Install dependencies (non-macOS)
      if: runner.os != 'macOS'
      run: |
        uv sync --no-dev
        
    - name: Create .env file for ai_body
      run: |
        # 공통 API_KEY 설정
        TEST_API_KEY="test-api-key-for-ci"
        
        # ai_body (Port 8003)
        cd apps/ai_body
        cp .env.example .env
        if [[ "$OSTYPE" == "darwin"* ]]; then
          sed -i '' "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        else
          sed -i "s/API_KEY=.*/API_KEY=$TEST_API_KEY/" .env
        fi
        cd ../..
        
    - name: Remove jax/jaxlib and prepare environment (macOS x86_64)
      if: runner.os == 'macOS'
      run: |
        # macOS x86_64에서 ai_body 시작 전에 jax/jaxlib 완전히 제거
        if [[ "$(uname -m)" == "x86_64" ]]; then
          echo "Removing jax/jaxlib before starting ai_body..."
          # 루트에서 제거
          uv pip uninstall -y jax jaxlib 2>/dev/null || true
          # ai_body 디렉토리에서도 제거
          cd apps/ai_body
          uv pip uninstall -y jax jaxlib 2>/dev/null || true
          cd ../..
          echo "✅ jax/jaxlib removed"
        fi
        
    - name: Start ai_body server
      run: |
        # ai_body 서버 시작 (Port 8003)
        cd apps/ai_body
        
        # macOS x86_64에서 jaxlib 문제를 피하기 위해 가상 환경 직접 사용
        if [[ "$(uname -m)" == "x86_64" ]] && [[ "$RUNNER_OS" == "macOS" ]]; then
          # uv의 가상 환경 경로 찾기 (workspace 루트의 .venv 사용)
          cd ../..
          if [ ! -d ".venv" ]; then
            uv venv --python 3.10
          fi
          # 가상 환경 활성화하고 Python 실행
          source .venv/bin/activate
          # jaxlib 다시 제거 (혹시 설치되었을 수 있음)
          pip uninstall -y jax jaxlib 2>/dev/null || true
          # ai_body 디렉토리로 이동하여 실행
          cd apps/ai_body
          python src/ai_body/main.py > /tmp/ai_body.log 2>&1 &
        else
          uv run python src/ai_body/main.py > /tmp/ai_body.log 2>&1 &
        fi
        echo $! > /tmp/ai_body.pid
        cd ../..
        
        echo "Waiting for ai_body server to start..."
        sleep 3  # 서버 시작 대기
        
    - name: Check ai_body process
      run: |
        # ai_body 프로세스가 실행 중인지 확인
        pid_file="/tmp/ai_body.pid"
        
        if [ ! -f "$pid_file" ]; then
          echo "❌ ai_body: PID file not found"
          exit 1
        fi
        
        pid=$(cat "$pid_file")
        if ps -p "$pid" > /dev/null 2>&1; then
          echo "✅ ai_body: Process running (PID: $pid)"
        else
          echo "❌ ai_body: Process not running (PID: $pid)"
          echo "Log:"
          cat "/tmp/ai_body.log" || true
          exit 1
        fi
        
    - name: Wait for ai_body to be ready
      run: |
        # ai_body가 포트에서 리스닝할 때까지 대기 (최대 30초)
        wait_for_port() {
          local port=$1
          local name=$2
          local max_attempts=30
          local attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            if lsof -i :$port > /dev/null 2>&1; then
              echo "✅ $name is listening on port $port"
              return 0
            fi
            attempt=$((attempt + 1))
            sleep 1
          done
          
          echo "❌ $name failed to start on port $port after ${max_attempts} seconds"
          return 1
        }
        
        wait_for_port 8003 "ai_body" || (cat /tmp/ai_body.log && exit 1)
        
        echo "ai_body server is ready!"
        sleep 2  # 추가 안정화 시간
        
    - name: Test ai_body health endpoint
      run: |
        test_health() {
          local url=$1
          local name=$2
          local max_attempts=5
          local attempt=0
          
          while [ $attempt -lt $max_attempts ]; do
            response=$(curl -s -w "\n%{http_code}" -H "X-API-Key: test-api-key-for-ci" "$url" 2>&1)
            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | head -n-1)
            
            if [ "$http_code" -eq 200 ]; then
              echo "✅ $name health check passed: $body"
              return 0
            fi
            
            attempt=$((attempt + 1))
            if [ $attempt -lt $max_attempts ]; then
              echo "⚠️  $name health check attempt $attempt failed (HTTP $http_code), retrying..."
              sleep 2
            fi
          done
          
          echo "❌ $name health check failed after $max_attempts attempts: HTTP $http_code"
          echo "Response: $body"
          echo "Log:"
          cat "/tmp/${name}.log" || true
          return 1
        }
        
        test_health "http://localhost:8003/health" "ai_body"
        
    - name: Stop ai_body server
      if: always()
      run: |
        if [ -f "/tmp/ai_body.pid" ]; then
          pid=$(cat "/tmp/ai_body.pid")
          kill "$pid" 2>/dev/null || true
          rm "/tmp/ai_body.pid" || true
        fi
