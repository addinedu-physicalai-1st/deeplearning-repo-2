[project]
name = "monitor-ai-emotion"
version = "0.1.0"
description = "Emotion Detection AI server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "python-dotenv>=1.0.0",
    "ultralytics>=8.4.9",
    "opencv-python>=4.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_emotion"]

[tool.uv.sources]
monitor-shared = { workspace = true }
