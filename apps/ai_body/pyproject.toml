[project]
name = "monitor-ai-body"
version = "0.1.0"
description = "Body Posture AI server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "mediapipe==0.10.14",
    "numpy>=1.24.0,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_body"]

[tool.uv.sources]
monitor-shared = { workspace = true }

[tool.uv]
# macOS x86_64에서 jax/jaxlib 완전 제외
# 이유: wheel이 없어 설치 불가, mediapipe는 선택적 의존성이므로 없어도 작동

# 1차: constraint로 해결 단계에서 제외
constraint-dependencies = [
    "jax; platform_machine != 'x86_64' or sys_platform != 'darwin'",
    "jaxlib; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]

# 2차: override로 강제 차단 (백업)
override-dependencies = [
    "jax==0.0.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "jaxlib==0.0.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
]
