[project]
name = "monitor-ai-body"
version = "0.1.0"
description = "Body Posture AI server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "mediapipe==0.10.14",
    "numpy>=1.24.0,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_body"]

[tool.uv.sources]
monitor-shared = { workspace = true }

[tool.uv]
# macOS x86_64에서 jaxlib 0.5.3 제외 (wheel이 없음)
# 모든 플랫폼에서 0.5.3 제외 (macOS x86_64에서만 문제가 있지만, 다른 플랫폼에서는 영향 없음)
constraint-dependencies = [
    "jaxlib!=0.5.3",
]

