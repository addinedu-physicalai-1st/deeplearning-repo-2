[project]
name = "monitor-ai-body"
version = "0.1.0"
description = "Body Posture AI server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "mediapipe==0.10.14",
    "numpy>=1.24.0,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_body"]

[tool.uv.sources]
monitor-shared = { workspace = true }

[tool.uv]
# macOS x86_64에서 jaxlib 완전 차단 (2중 방어)

# 1차 방어: constraint-dependencies (직접 의존성 차단)
constraint-dependencies = [
    "jaxlib; platform_machine != 'x86_64' or sys_platform != 'darwin'",
]

# 2차 방어: override-dependencies (간접 의존성까지 강제 차단)
override-dependencies = [
    "jaxlib==0.0.0; platform_machine == 'x86_64' and sys_platform == 'darwin'",
]
