[project]
name = "monitor-ai-body"
version = "0.1.0"
description = "Body Posture AI server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "mediapipe==0.10.14",
    "numpy>=1.24.0,<2.0",
    "jaxlib!=0.5.3; sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_body"]

[tool.uv.sources]
monitor-shared = { workspace = true }

[tool.uv]
# macOS x86_64에서 jaxlib 완전히 제외 (wheel이 없음)
# constraint-dependencies는 버전 제약만 가능하므로, 환경 변수 UV_CONSTRAINT_DEPENDENCIES 사용 권장
# 또는 uv sync 실행 시: UV_CONSTRAINT_DEPENDENCIES="jaxlib!=0.5.3" uv sync
constraint-dependencies = [
    "jaxlib!=0.5.3",
]

