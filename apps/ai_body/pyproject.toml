[project]
name = "monitor-ai-body"
version = "0.1.0"
description = "Body Posture AI server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "mediapipe==0.10.14",
    "numpy>=1.24.0,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_body"]

[tool.uv.sources]
monitor-shared = { workspace = true }

[tool.uv]
# macOS x86_64에서 jaxlib 완전히 제외
# mediapipe가 jaxlib을 선택적 의존성으로 요구하지만, macOS x86_64용 wheel이 전혀 없음
# 주의: constraint-dependencies만으로는 모든 버전을 제외할 수 없음
# 해결: scripts/dev.py에서 자동으로 uv sync 전/후에 jaxlib 제거
# 수동 실행 시: uv pip uninstall -y jaxlib && uv sync && uv pip uninstall -y jaxlib
constraint-dependencies = []

