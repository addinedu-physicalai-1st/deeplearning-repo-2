[project]
name = "monitor-ai-gaze"
version = "0.1.0"
description = "Gaze Tracking AI server"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "python-dotenv>=1.0.0",
    "opencv-python>=4.8.0",
    "mediapipe==0.10.14",
    "numpy>=1.24.0,<2.0",
    "scikit-learn>=1.3.0",
    "jaxlib!=0.5.3; sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gaze"]

[tool.uv.sources]
monitor-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
