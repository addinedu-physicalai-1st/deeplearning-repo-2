[project]
name = "monitor-operation-server"
version = "0.1.0"
description = "Operation server for business logic and DB management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.46",
]

[tool.hatch.build.targets.wheel]
packages = ["src/operation_server"]

[tool.uv.sources]
monitor-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
