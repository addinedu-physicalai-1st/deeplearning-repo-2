[project]
name = "monitor-ai-head"
version = "0.1.0"
description = "Head Pose AI server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_head"]

[tool.uv.sources]
monitor-shared = { workspace = true }
