[project]
name = "monitor-llm-server"
version = "0.1.0"
description = "LLM Feedback server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "monitor-shared",
    "python-dotenv>=1.0.0",
    "ollama>=0.6.1",
    "httpx>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_server"]

[tool.uv.sources]
monitor-shared = { workspace = true }
